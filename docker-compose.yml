# docker-compose.yml - MALARIA_DETECTION
# Auteur : Papa Malick NDIAYE | Master DSGL, UADB

services:
  malaria-api:
    image: malaria-detection:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: malaria_detection_api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
    # L'API n'a besoin que du modele et des metriques.
    # Le dataset ne sert qu'a l'entrainement, hors conteneur.
    volumes:
      - ./models:/app/models:ro
      - ./metrics:/app/metrics:ro
    restart: unless-stopped
    healthcheck:
      test        : ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval    : 30s
      timeout     : 10s
      retries     : 3
      start_period: 60s
