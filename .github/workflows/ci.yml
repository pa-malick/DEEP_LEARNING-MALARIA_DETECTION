name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Le dataset et les modeles ne sont pas versionnes. La suite de tests
      # est concue pour s'executer sans eux : l'API demarre en mode degrade
      # et les tests de prediction acceptent une reponse 503.
      - name: Lancer les tests
        run: pytest tests/ -v

      - name: Verifier que l'image Docker se construit
        run: docker build -t malaria-detection:ci .
